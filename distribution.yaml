name: voice
version: 0.1.3
description: "Home voice assistant. Short spoken answers, basic Home Assistant control, Hindsight memory recall and quick web search; hands bigger jobs to other profiles over a2a."
hermes_requires: ">=0.23.0"
author: "tewing"
license: "MIT"

env_requires:
  - name: OLLAMA_API_KEY
    description: "Ollama Cloud key for the default model (glm-5.3-flash:cloud via the custom provider in config.yaml)."
    required: true
  - name: API_SERVER_KEY
    description: "Bearer key Home Assistant's hermes_voice integration sends to this profile's API endpoint (/p/voice/v1)."
    required: true
  - name: HASS_URL
    description: "Home Assistant base URL for the homeassistant plugin."
    required: true
  - name: HASS_TOKEN
    description: "Home Assistant long-lived access token for the homeassistant plugin."
    required: true
  - name: HINDSIGHT_API_URL
    description: "Hindsight server URL (shared memory). Mode and recall settings ship in hindsight/config.json."
    required: false
    default: ""
  - name: HINDSIGHT_BANK_ID
    description: "Hindsight memory bank to recall from."
    required: false
    default: ""
  - name: HINDSIGHT_API_KEY
    description: "Hindsight tenant API key, if the server requires one."
    required: false
    default: ""

# Plugins can't ship in a distribution: Hermes installs hindsight (memory.provider)
# and homeassistant on the profile's first start while security.allow_lazy_installs is on.
distribution_owned:
  - SOUL.md
  - config.yaml
  - profile.yaml
  - hindsight/
  - distribution.yaml

model:
  base_url: https://ollama.com/v1
  default: glm-5.3-flash:cloud
  provider: custom
_config_version: 52
agent:
  disabled_toolsets:
    - session_search
  reasoning_effort: low
platform_toolsets:
  api_server:
    - delegation
    - memory
    - todo
    - web
    - x_search
    - homeassistant
known_plugin_toolsets:
  api_server:
    - a2a
  acp:
    - homeassistant
  webhook:
    - homeassistant
known_builtin_toolsets:
  api_server:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
plugins:
  enabled:
    - advanced-delegation
    - hindsight
    - homeassistant
  disabled: []
memory:
  provider: hindsight
skills:
  disabled: []
delegation:
  backend: profile_routes
  backends:
    profile_routes:
      profiles:
        - name: media
          description: >-
            Movies, TV and music: what to watch or play, recommendations, the Nuvio
            library, watch history and addons. Returns plain text; say it in your own words.
